
name: Android APK verification
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Restore official Android Gradle wrapper
        run: bash scripts/bootstrap_android.sh
      - name: Configure public client values (never service-role secrets)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://lpxdtokwvhxtfzzzdlzv.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_pb2cf5LI_P52l0Ur-dwDIQ_I6s16pY8' }}
          UPC_PUBLIC_URL: ${{ vars.UPC_PUBLIC_URL }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          SUPPORT_PHONE: ${{ vars.SUPPORT_PHONE }}
        run: |
          python3 - <<'PY'
          import os,json
          keys=['SUPABASE_URL','SUPABASE_ANON_KEY','UPC_PUBLIC_URL','SUPPORT_EMAIL','SUPPORT_PHONE']
          with open('config/ci.json','w') as f: json.dump({k:os.getenv(k,'') for k in keys},f)
          PY
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded
      - name: Build release-mode APK with test signing
        run: flutter build apk --release --dart-define-from-file=config/ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: upc-android-release-test-signed
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upc-test-reports
          path: build/test-results/
          if-no-files-found: ignore
